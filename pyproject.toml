[project]
name = "fair-or-foul"
version = "0.1.0"
description = "Code and data pipeline behind the 'Fair or Foul' Substack series on baseball strategy."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6",
    "requests>=2.32",
    "tabulate>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]

[tool.uv]
python-preference = "only-managed"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
